<title>Helling Hero — lineaire verbanden</title>
<style>

<script>
'use strict';
const TOPICS = [
{id:'tables',icon:'🔎',title:'1. Lineair of niet?',desc:'Verschillen in tabellen herkennen',goal:'Je kunt aan de verschillen zien of een tabel een lineair verband beschrijft.',sections:[
{title:'Kijk naar de stapjes',body:`<p>Bij een <b>lineair verband</b> verandert <b>y steeds evenveel</b> als x gelijke stapjes maakt. Kijk niet alleen of getallen groter worden: kijk hoeveel erbij komt of afgaat.</p><div class="tablewrap"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y</th><td>2</td><td>5</td><td>8</td><td>11</td></tr></table></div><div class="callout"><b>Check:</b> 2 → 5 is +3, 5 → 8 is +3, 8 → 11 is +3. De verandering is steeds gelijk, dus dit is lineair.</div>`,qs:[
{q:'De y-waarden zijn 4, 7, 10, 13. x gaat steeds 1 omhoog. Is dit lineair?',a:['Ja, de verandering is steeds +3.','Nee, want y is niet gelijk aan x.','Nee, want de getallen stijgen.'],ok:0,why:'De verschillen zijn +3, +3 en +3. De verandering blijft gelijk.',extra:'Streep de waarden naast elkaar aan en trek ze van elkaar af: 7 − 4 = 3, 10 − 7 = 3 en 13 − 10 = 3. Alle uitkomsten zijn gelijk. Daarom is de tabel lineair.',worked:'Een vast verschil betekent lineair. De reeks 1, 4, 7, 10 is ook lineair: steeds +3.'},
{q:'Welke rij is NIET lineair als x steeds 1 omhooggaat?',a:['2, 5, 8, 11','10, 8, 6, 4','1, 3, 6, 10'],ok:2,why:'Bij 1, 3, 6, 10 zijn de verschillen +2, +3 en +4. Die zijn niet gelijk.',extra:'Bij lineair moeten alle stapjes even groot zijn. In 1, 3, 6, 10 wordt het verschil steeds groter: eerst 2 erbij, dan 3, dan 4. Dat is dus niet lineair.',worked:'Voorbeeld lineair: 1, 3, 5, 7. Voorbeeld niet lineair: 1, 3, 6, 10.'},
{q:'x gaat steeds 2 omhoog. y gaat 5, 9, 13, 17. Is dit lineair?',a:['Ja, y verandert steeds +4.','Nee, want x gaat niet met 1 omhoog.','Nee, want y is oneven.'],ok:0,why:'De x-stappen zijn steeds even groot (+2) en de y-stappen ook steeds (+4). Dit is lineair.',extra:'x hoeft niet altijd met 1 te veranderen. Je moet alleen gelijke x-stappen met elkaar vergelijken. Hier is elke x-stap +2 en elke y-stap +4.',worked:'Als x telkens +2 en y telkens +4 gaat, verandert y per stap steeds op dezelfde manier. De verhouding is constant.'}]},
{title:'Ook dalen kan lineair zijn',body:`<p>Een lijn hoeft niet omhoog te gaan. Een <b>vaste afname</b> is ook lineair.</p><div class="tiles"><div class="tile"><b>12 → 9</b>−3</div><div class="tile"><b>9 → 6</b>−3</div><div class="tile"><b>6 → 3</b>−3</div></div><div class="callout warm">Let op: als x gelijke stappen maakt, moeten de verschillen in y gelijk zijn. Ze mogen positief, negatief of nul zijn.</div>`,qs:[
{q:'De y-waarden zijn 18, 12, 6, 0. Welk verband?',a:['Lineair, steeds −6','Niet lineair: de getallen dalen','Recht evenredig, want er komt steeds iets af'],ok:0,why:'De verschillen zijn telkens −6. Dat is een lineair verband met een dalende lijn.',extra:'Reken uit: 12 − 18 = −6, 6 − 12 = −6, 0 − 6 = −6. Steeds dezelfde afname betekent lineair.',worked:'Een voorbeeld van een dalend lineair verband is y = −6x + 18.'},
{q:'x is 0, 1, 2, 3 en y is 7, 8, 7, 4. Is de tabel lineair?',a:['Ja','Nee, want de verschillen zijn +1, −1 en −3.','Ja, omdat y eerst stijgt.'],ok:1,why:'De verandering is niet constant: +1, daarna −1, daarna −3.',extra:'Vergelijk twee opeenvolgende y-getallen: 7 naar 8 = +1. 8 naar 7 = −1. 7 naar 4 = −3. Dat is niet steeds hetzelfde.',worked:'Om lineair te zijn moet hetzelfde verschil zich herhalen, bijvoorbeeld +1, +1, +1.'}]}
]},
{id:'formula',icon:'🧩',title:'2. De formule y = ax + b',desc:'Hellingsgetal, startgetal en lineaire formules',goal:'Je kunt a en b herkennen en beoordelen of een formule lineair is.',sections:[
{title:'Ontdek a en b',body:`<div class="formula">y = ax + b</div><div class="tiles"><div class="tile"><b>a</b><b>Hellingsgetal</b><span class="small">Hoeveel y verandert als x 1 stijgt.</span></div><div class="tile"><b>b</b><b>Startgetal</b><span class="small">De waarde van y bij x = 0.</span></div></div><p>Voorbeeld: <b>y = 3x + 2</b>. Het hellingsgetal is 3. Het startgetal is 2. Bij x = 0 is y dus 2.</p>`,qs:[
{q:'Wat zijn het hellingsgetal en startgetal van y = 4x + 7?',a:['a = 7 en b = 4','a = 4 en b = 7','a = 11 en b = 0'],ok:1,why:'Het getal vóór x is a = 4. Het losse getal is b = 7.',extra:'Zoek eerst het getal dat bij x staat: 4x. Dat is het hellingsgetal. Het getal zonder x, +7, is het startgetal.',worked:'Bij y = −2x + 5 is a = −2 en b = 5.'},
{q:'In y = −2x + 5, wat is het startgetal?',a:['−2','5','−5'],ok:1,why:'Het startgetal is het getal zonder x. Dat is +5.',extra:'Je kunt x = 0 invullen: y = −2 × 0 + 5 = 5. Daarom is het startgetal 5.',worked:'Bij y = 7x − 4 is het startgetal −4.'},
{q:'Welke formule is NIET lineair?',a:['y = 5x + 2','w = 3t','p = 5m + m²'],ok:2,why:'Bij p = 5m + m² staat ook een kwadraat (m²). Dat past niet in de lineaire vorm y = ax + b.',extra:'Een lineaire formule heeft de variabele alleen in een gewone term, zoals 5m. Een term als m² maakt de formule niet lineair.',worked:'Lineair: p = 4a + 3. Niet lineair: p = a² + 3.'}]},
{title:'Lineair, horizontaal of verticaal?',body:`<p>Een lineaire formule heeft meestal de vorm <b>y = ax + b</b>. Let op deze speciale gevallen:</p><div class="tiles"><div class="tile"><b>y = 6</b>Horizontale lijn</div><div class="tile"><b>x = −2</b>Verticale lijn</div><div class="tile"><b>y = 0x + 6</b>Ook horizontaal: y = 6</div></div><div class="callout warm">Bij een verticale lijn x = een getal hoort geen formule van de vorm y = ax + b. Voor elke y-waarde blijft x hetzelfde.</div>`,qs:[
{q:'Welke vergelijking hoort bij een verticale lijn?',a:['y = −3','x = 6','y = 6'],ok:1,why:'Bij x = 6 blijft de x-coördinaat altijd 6. Dat is een verticale lijn.',extra:'Een verticale lijn loopt van beneden naar boven op één vaste plek op de x-as. Daarom blijft x constant en schrijf je x = 6.',worked:'x = −3 is ook een verticale lijn; y = −3 is horizontaal.'},
{q:'Welke formule is een lineaire formule met een horizontale lijn?',a:['y = 5','x = 5','y = 5x'],ok:0,why:'Bij y = 5 is de y-waarde altijd 5, wat x ook is. De lijn is horizontaal.',extra:'Horizontaal betekent: dezelfde hoogte. De y-waarde blijft dus constant. Bij x = 5 blijft juist de x-waarde constant: dat is verticaal.',worked:'y = −4 is ook horizontaal.'}]}
]},
{id:'direction',icon:'↗️',title:'3. Stijgend, dalend of horizontaal?',desc:'De richting van een lijn uit de formule halen',goal:'Je kunt aan a zien hoe de lijn loopt.',sections:[
{title:'Het teken van a vertelt de richting',body:`<div class="tiles"><div class="tile"><b>a &gt; 0</b>Stijgende lijn ↗</div><div class="tile"><b>a &lt; 0</b>Dalende lijn ↘</div><div class="tile"><b>a = 0</b>Horizontale lijn →</div></div><p>Voorbeeld: y = 4x + 1 stijgt. y = −3x + 5 daalt. y = 7 blijft horizontaal.</p>`,qs:[
{q:'Welke formule geeft een dalende lijn?',a:['y = 5x + 1','y = −2x + 4','y = 7'],ok:1,why:'Het hellingsgetal −2 is negatief. De lijn daalt als je naar rechts gaat.',extra:'Kijk alleen naar het getal voor x. Positief = stijgend; negatief = dalend; nul of geen x-term = horizontaal.',worked:'y = −0,5x + 8 daalt ook, maar minder steil.'},
{q:'Welke lijn stijgt het steilst?',a:['y = 2x + 1','y = 5x − 4','y = 3x + 9'],ok:1,why:'Bij positieve hellingsgetallen is de grootste a het steilst. Hier is 5 het grootst.',extra:'Vergelijk de hellingsgetallen 2, 5 en 3. De lijn met a = 5 stijgt per stap het meest.',worked:'Bij positieve a is 5 steiler dan 3, en 3 steiler dan 2.'},
{q:'Wat is de richting van y = −1,5x + 9?',a:['Stijgend','Dalend','Horizontaal'],ok:1,why:'Het hellingsgetal −1,5 is negatief, dus de lijn daalt.',extra:'Een minteken voor het hellingsgetal betekent dat y kleiner wordt als x groter wordt.',worked:'Bij y = +1,5x + 9 zou de lijn stijgen.'}]},
{title:'Horizontale en verticale lijnen uit elkaar houden',body:`<p>De woorden lijken op elkaar, maar kijk welke coördinaat gelijk blijft.</p><div class="twocol"><div class="tile"><b>y = 3</b>Alle punten hebben y = 3. Horizontaal.</div><div class="tile"><b>x = 3</b>Alle punten hebben x = 3. Verticaal.</div></div>`,qs:[
{q:'De lijn gaat door (0, 4), (2, 4) en (5, 4). Welke formule hoort erbij?',a:['x = 4','y = 4','y = 4x'],ok:1,why:'De y-coördinaat is steeds 4. De lijn is horizontaal: y = 4.',extra:'In elk punt blijft de tweede coördinaat gelijk aan 4. De tweede coördinaat is y, dus schrijf je y = 4.',worked:'(0, 4) en (2, 4) liggen allebei op de horizontale lijn y = 4.'},
{q:'Welke vergelijking hoort bij de verticale lijn door (−3, −7)?',a:['y = −7','x = −3','y = −3'],ok:1,why:'Bij een verticale lijn blijft x gelijk. Het punt heeft x = −3, dus x = −3.',extra:'Bij een verticale lijn gebruik je de eerste coördinaat van het punt. De tweede coördinaat kan veranderen.',worked:'De verticale lijn door (2, 30) heeft formule x = 2.'}]}
]},
{id:'proportional',icon:'⚖️',title:'4. Recht evenredig',desc:'De formule y = ax en de oorsprong',goal:'Je herkent een recht evenredig verband in een formule, tabel of grafiek.',sections:[
{title:'Wat betekent recht evenredig?',body:`<div class="formula">y = ax</div><p>Recht evenredig is een speciaal soort lineair verband. Er staat <b>geen los startgetal</b> achter de x, dus b = 0. De grafiek gaat door de oorsprong (0, 0).</p><p>Bij y = 2,5x hoort: x = 1 → y = 2,5; x = 2 → y = 5; x = 4 → y = 10. Verdubbelt x, dan verdubbelt y.</p>`,qs:[
{q:'Welke formule hoort bij een recht evenredig verband?',a:['y = 4x','y = 4x + 10','y = 0,2x + 6'],ok:0,why:'Recht evenredig heeft de vorm y = ax. Er staat geen los getal bij.',extra:'Vul x = 0 in. Bij y = 4x wordt y = 0: de grafiek gaat door de oorsprong. Bij +10 of +6 begint de lijn ergens anders.',worked:'y = −3x is ook recht evenredig; a mag negatief zijn.'},
{q:'Bij y = 3x wordt x drie keer zo groot. Wat gebeurt er met y?',a:['y blijft gelijk','y wordt ook drie keer zo groot','y wordt 3 groter'],ok:1,why:'Bij recht evenredig wordt y met dezelfde factor vermenigvuldigd als x.',extra:'Als x eerst 2 is, dan is y = 6. Als x drie keer zo groot wordt (6), is y = 18: dat is ook drie keer 6.',worked:'Bij y = 3x: x=2 geeft y=6; x=6 geeft y=18.'}]},
{title:'Recht evenredig herkennen in een tabel',body:`<p>Bij een recht evenredig verband is de verhouding y ÷ x steeds hetzelfde (behalve bij x = 0). De tabel bevat ook het punt (0, 0).</p><div class="tablewrap"><table><tr><th>x</th><td>0</td><td>2</td><td>4</td><td>6</td></tr><tr><th>y</th><td>0</td><td>10</td><td>20</td><td>30</td></tr></table></div><p>Hier is y steeds 5 keer x. De formule is y = 5x.</p>`,qs:[
{q:'Welke tabel is recht evenredig?',a:['x: 0,1,2; y: 2,4,6','x: 0,1,2; y: 0,4,8','x: 1,2,3; y: 2,5,8'],ok:1,why:'In de tabel met y: 0, 4, 8 is y steeds 4 keer x en bij x = 0 is y = 0. De formule is y = 4x.',extra:'Bij de tabel met y: 2, 4, 6 is y bij x=0 al 2; die begint dus niet in de oorsprong. Bij de tabel met x: 1, 2, 3 zijn de verschillen wel gelijk, maar de verhouding is niet constant.',worked:'Recht evenredig: y = 3x. Lineair maar niet recht evenredig: y = 3x + 2.'},
{q:'Een recht evenredig verband heeft de formule y = ax. Waarom gaat de grafiek dan door de oorsprong (0, 0)?',a:['In de oorsprong is x = 0, en dan is y = a × 0 = 0','Omdat de lijn altijd stijgt','Omdat het hellingsgetal 0 is'],ok:0,why:'Bij y = ax geldt als x = 0: y = a × 0 = 0. Dus (0, 0) ligt op de lijn.',extra:'De oorsprong is het punt (0, 0). De formule y = ax heeft geen startgetal. Bij x = 0 wordt y automatisch 0.',worked:'y = 2,5x geeft bij x=0: y=2,5×0=0.'}]}
]},
{id:'calculate',icon:'🧮',title:'5. Waarden berekenen',desc:'Getallen in een formule invullen en een tabel maken',goal:'Je vult x in, rekent y uit en controleert mintekens.',sections:[
{title:'Vul x in de formule in',body:`<p>Bij <b>y = 2x + 3</b> en x = 4 vervang je de x door 4.</p><div class="formula">y = 2 × 4 + 3 = 11</div><ol><li>Vervang x door de gegeven waarde.</li><li>Reken eerst de vermenigvuldiging uit.</li><li>Tel daarna op of trek af.</li></ol>`,qs:[
{q:'y = 3x − 2. Hoe groot is y als x = 4?',a:['10','14','6'],ok:0,why:'y = 3 × 4 − 2 = 12 − 2 = 10.',extra:'Vervang x door 4. Eerst 3×4=12. Daarna 12−2=10. De min hoort bij het startgetal.',worked:'Bij y = 3x − 2 en x=2 krijg je y=6−2=4.'},
{q:'y = −2x + 6. Bereken y als x = 2.',a:['2','4','10'],ok:0,why:'y = −2 × 2 + 6 = −4 + 6 = 2.',extra:'Let goed op dat −2 keer 2 gelijk is aan −4. Daarna tel je 6 erbij op. −4 + 6 = 2.',worked:'Bij x=3: y = −6 + 6 = 0.'},
{q:'De formule is y = 2,5x. Wat is y als x = 4?',a:['6,5','10','2,5'],ok:1,why:'y = 2,5 × 4 = 10.',extra:'Bij een decimaal getal zoals 2,5 vermenigvuldig je gewoon. Tweeënhalf keer vier is tien.',worked:'Bij x=2 wordt y=2,5×2=5.'}]},
{title:'Van formule naar tabel',body:`<p>Vul voor iedere x-waarde de formule opnieuw in. Bij y = 2x + 1:</p><div class="tablewrap"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y</th><td>1</td><td>3</td><td>5</td><td>7</td></tr></table></div><div class="callout">Bij x = 0 blijft alleen het startgetal over. Dat is een snelle controle.</div>`,qs:[
{q:'Bij y = −x + 4, welke y-waarde hoort bij x = 3?',a:['7','1','−1'],ok:1,why:'y = −3 + 4 = 1.',extra:'Omdat er −x staat, vermenigvuldig je x met −1. Bij x=3 wordt dat −3. Daarna tel je 4 erbij op.',worked:'x=0 → y=4; x=1 → y=3; x=2 → y=2; x=3 → y=1.'},
{q:'Bij y = 5x + 2, wat is y bij x = 0?',a:['0','2','5'],ok:1,why:'5×0+2=2. Het startgetal is de y-waarde bij x=0.',extra:'Alles wat met nul wordt vermenigvuldigd, is nul. Dus 5×0 verdwijnt en je houdt +2 over.',worked:'Bij y = ax + b is de waarde bij x=0 altijd b.'}]}
]},
{id:'sketch',icon:'📉',title:'6. Een lijn schetsen',desc:'Startpunt, stijging en daling gebruiken',goal:'Je kunt een lijn tekenen door het startpunt te vinden en het hellingsgetal te gebruiken.',sections:[
{title:'Begin bij het startgetal',body:`<p>Bij <b>y = 2x + 1</b> is het startgetal 1. Zet eerst punt <b>(0, 1)</b> op de y-as. Het eerste getal is x, het tweede is y.</p><div class="graphbox"><canvas class="graph" id="sampleGraph" width="480" height="480" aria-label="Voorbeeldgrafiek van y gelijk aan 2x plus 1"></canvas></div><p>Het hellingsgetal is 2: ga vanaf (0,1) één hokje naar rechts en twee omhoog. Zet nog een punt en trek een rechte lijn.</p>`,qs:[
{q:'Waar begint de lijn y = 3x + 2 op de y-as?',a:['(3, 2)','(0, 2)','(0, 3)'],ok:1,why:'Het startgetal is 2, dus het startpunt op de y-as is (0, 2).',extra:'Op de y-as is x altijd 0. Vul x=0 in: y=3×0+2=2. Het punt is dus (0,2), niet (3,2).',worked:'y = −x + 5 begint bij (0,5).'},
{q:'Bij y = −2x + 4, welke stap maak je vanaf het startpunt als je 1 naar rechts gaat?',a:['2 omhoog','2 omlaag','4 omhoog'],ok:1,why:'a = −2. Het negatieve teken betekent dat de lijn daalt: 1 naar rechts, 2 omlaag.',extra:'Start bij (0,4). Een hellingsgetal van −2 betekent: als x één toeneemt, neemt y met 2 af.',worked:'Van (0,4) kom je bij (1,2), daarna bij (2,0).'}]},
{title:'Schets ook horizontale en verticale lijnen',body:`<p>Niet elke grafiek is schuin.</p><div class="tiles"><div class="tile"><b>y = −2</b>Teken een horizontale lijn op hoogte −2.</div><div class="tile"><b>x = 3</b>Teken een verticale lijn bij x = 3.</div></div><div class="callout warm">Bij y = een getal blijft de hoogte gelijk. Bij x = een getal blijft de plek links-rechts gelijk.</div>`,qs:[
{q:'Welke lijn moet je tekenen voor y = 3?',a:['Horizontaal door hoogte 3','Verticaal bij x = 3','Schuin omhoog'],ok:0,why:'De y-waarde blijft 3, dus alle punten liggen op dezelfde horizontale hoogte.',extra:'Kies verschillende x-waarden: (0,3), (1,3), (2,3). De punten liggen naast elkaar op één horizontale lijn.',worked:'y=−4 is ook een horizontale lijn, vier onder de x-as.'},
{q:'Welke lijn hoort bij x = −4?',a:['Horizontaal door y = −4','Verticaal bij x = −4','Een lijn die door de oorsprong gaat'],ok:1,why:'De x-waarde blijft −4. Dat is een verticale lijn links van de y-as.',extra:'Bij x = −4 kan y allerlei waarden hebben, bijvoorbeeld (−4,0), (−4,2) en (−4,−3). De punten staan recht boven elkaar.',worked:'Een verticale lijn heeft de vorm x = getal.'}]}
]},
{id:'tableformula',icon:'📝',title:'7. Een formule bij een tabel',desc:'Het hellingsgetal en startgetal vinden',goal:'Je stelt een formule op door eerst de verandering en dan de beginwaarde te vinden.',sections:[
{title:'Vind a en b in de tabel',body:`<p>Kijk naar de tabel. x gaat telkens 1 omhoog en y telkens 3 omhoog.</p><div class="tablewrap"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y</th><td>4</td><td>7</td><td>10</td><td>13</td></tr></table></div><ol><li>De verandering is steeds +3, dus <b>a = 3</b>.</li><li>Bij x = 0 is y = 4, dus <b>b = 4</b>.</li><li>De formule is <b>y = 3x + 4</b>.</li></ol>`,qs:[
{q:'x: 0, 1, 2, 3 en y: 6, 10, 14, 18. Wat is de formule?',a:['y = 4x + 6','y = 6x + 4','y = 4x'],ok:0,why:'y neemt steeds met 4 toe, dus a=4. Bij x=0 is y=6, dus b=6. Formule: y=4x+6.',extra:'Zoek twee dingen: het stapverschil in y en de waarde bij x=0. Die zijn respectievelijk 4 en 6.',worked:'Een regelmatige tabel met startwaarde 6 en telkens +4 heeft formule y=4x+6.'},
{q:'x: 0, 1, 2, 3 en y: 8, 5, 2, −1. Welke formule hoort erbij?',a:['y = 3x + 8','y = −3x + 8','y = −3x − 8'],ok:1,why:'y neemt steeds met 3 af, dus a=−3. De startwaarde is 8. Daarom y=−3x+8.',extra:'Van 8 naar 5 is −3; van 5 naar 2 is −3. Het hellingsgetal is dus negatief. Bij x=0 staat y=8.',worked:'Bij x=1 geeft −3+8=5, dat klopt met de tabel.'}]},
{title:'Als x niet met 1 verandert',body:`<p>Als x telkens met 2 stijgt, deel je de verandering in y door 2 om a te vinden.</p><div class="callout"><b>Formule:</b> hellingsgetal a = verandering van y ÷ verandering van x.</div><p>Voorbeeld: x gaat 2 omhoog en y gaat 10 omhoog. Dan is a = 10 ÷ 2 = 5.</p>`,qs:[
{q:'x: 2, 4, 6, 8 en y: 3, 6, 9, 12. Wat is a?',a:['1,5','3','6'],ok:0,why:'x neemt telkens 2 toe; y neemt telkens 3 toe. a = 3 ÷ 2 = 1,5.',extra:'De y-verandering is 3, maar x gaat niet één omhoog: x gaat twee omhoog. Dus je deelt 3 door 2.',worked:'a = Δy / Δx = 3 / 2 = 1,5.'},
{q:'Bij x=0 is y=−2. Elke stap van x geeft +5 bij y. Welke formule?',a:['y = 5x − 2','y = −2x + 5','y = 5x + 2'],ok:0,why:'Het hellingsgetal is 5 en het startgetal is −2. Dus y=5x−2.',extra:'De verandering vertelt a: +5. De waarde wanneer x nul is vertelt b: −2. Plaats ze in y=ax+b.',worked:'y=5×0−2=−2, dat klopt met de startwaarde.'}]}
]},
{id:'twopoints',icon:'📍',title:'8. Formule door twee punten',desc:'Hellingsgetal berekenen en daarna b vinden',goal:'Je vindt de formule van een lijn als twee punten gegeven zijn.',sections:[
{title:'Eerst het hellingsgetal',body:`<p>Gegeven zijn A(2, 5) en B(4, 9). De x-coördinaat gaat van 2 naar 4: dat is +2. De y-coördinaat gaat van 5 naar 9: dat is +4.</p><div class="formula">a = verandering y ÷ verandering x</div><div class="formula">a = 4 ÷ 2 = 2</div><p>De lijn heeft dus de vorm <b>y = 2x + b</b>.</p>`,qs:[
{q:'Punt A(1, 2) en B(4, 11). Wat is het hellingsgetal?',a:['3','9','4'],ok:0,why:'x neemt toe met 4−1=3. y neemt toe met 11−2=9. a=9÷3=3.',extra:'Verandering x is 3, verandering y is 9. Je deelt de y-verandering door de x-verandering: 9/3=3.',worked:'a = (y₂−y₁)/(x₂−x₁) = (11−2)/(4−1) = 3.'},
{q:'A(3, 9) en B(8, −21). Wat is a?',a:['−6','−30','−5'],ok:0,why:'Verandering x = 8−3=5. Verandering y = −21−9=−30. a = −30÷5 = −6.',extra:'Omdat y van 9 naar −21 daalt, is de verandering negatief. Je deelt −30 door 5 en krijgt −6.',worked:'De lijn daalt; het hellingsgetal moet dus negatief zijn.'}]},
{title:'Daarna het startgetal b',body:`<p>We weten nu dat y = 2x + b. Gebruik één van de punten, bijvoorbeeld A(2,5). Vul x=2 en y=5 in.</p><div class="formula">5 = 2 × 2 + b</div><div class="formula">5 = 4 + b → b = 1</div><p>Dus de formule is <b>y = 2x + 1</b>. Controleer altijd door het tweede punt ook in te vullen.</p>`,qs:[
{q:'De lijn heeft hellingsgetal 3 en gaat door (2, 11). Wat is b?',a:['5','11','17'],ok:0,why:'Vul in: 11 = 3×2 + b. Dus 11 = 6 + b en b = 5.',extra:'Trek 6 van beide kanten af: 11−6=5. Je krijgt b=5.',worked:'Controle: y=3×2+5=11.'},
{q:'Een lijn gaat door (0, 6) en (2, 10). Wat is de formule?',a:['y = 2x + 6','y = 4x + 6','y = 2x + 10'],ok:0,why:'a=(10−6)/(2−0)=2. Bij x=0 is y=6, dus b=6. De formule is y=2x+6.',extra:'Omdat één punt x=0 heeft, kun je het startgetal direct zien: b=6. De y-waarde gaat +4 terwijl x +2 gaat, dus a=2.',worked:'Controle bij x=2: 2×2+6=10.'}]}
]},
{id:'graphs',icon:'🧭',title:'9. Een grafiek aflezen',desc:'Startwaarde, helling en formule uit een grafiek halen',goal:'Je leest punten van een grafiek af en maakt daar een formule bij.',sections:[
{title:'Zo lees je een lijn af',body:`<p>Zoek eerst waar de lijn de <b>y-as</b> snijdt. Dat is b. Kijk daarna hoeveel de lijn stijgt of daalt als je naar rechts gaat. Dat is a.</p><div class="graphbox"><canvas class="graph" id="readGraph" width="480" height="480" aria-label="Voorbeeldgrafiek met startgetal 2 en hellingsgetal 1"></canvas></div><p>In dit voorbeeld start de lijn bij y=2 en gaat hij 1 omhoog als x 1 omhooggaat. De formule is <b>y = x + 2</b>.</p>`,qs:[
{q:'Een lijn snijdt de y-as bij 5 en gaat per stap naar rechts 2 omhoog. Welke formule?',a:['y = 2x + 5','y = 5x + 2','y = −2x + 5'],ok:0,why:'De beginwaarde is b=5. De stijging per stap is a=2. De formule is y=2x+5.',extra:'Koppel wat je ziet aan de formule: snijpunt op de y-as wordt b; de stapgrootte wordt a.',worked:'Begin bij 5 en tel steeds 2 erbij: 5, 7, 9, 11.'},
{q:'Een lijn snijdt de y-as bij 8 en daalt per stap 2. Welke formule past?',a:['y = 2x + 8','y = −2x + 8','y = −8x + 2'],ok:1,why:'Startgetal b=8; dalen met 2 betekent a=−2. Dus y=−2x+8.',extra:'Dalend betekent een negatief hellingsgetal. De lijn start bij 8, dus het losse getal blijft +8.',worked:'Bij x=1 is y=6; bij x=2 is y=4.'}]},
{title:'Punten gebruiken als de grafiek geen formule geeft',body:`<p>Lees twee roosterpunten af. Bijvoorbeeld (0, 3) en (2, 7). De verandering in y is 4 en de verandering in x is 2, dus a=4÷2=2. De startwaarde is 3. Formule: <b>y = 2x + 3</b>.</p><div class="callout warm">Lees punten zorgvuldig af. Controleer de schaal van beide assen: een stapje op de y-as kan bijvoorbeeld 5 euro zijn.</div>`,qs:[
{q:'Op de horizontale as staat het aantal foto’s, op de verticale as de kosten in euro. De lijn gaat door (0, 25) en (100, 45). Hoeveel stijgen de kosten per foto?',a:['€0,20 per foto','€20 per foto','€0,45 per foto'],ok:0,why:'De kosten stijgen 45−25=20 euro voor 100 foto’s. Per foto is dat 20÷100=€0,20.',extra:'De verticale as geeft euro’s en de horizontale as het aantal foto’s. Deel de toename van de kosten door de toename van het aantal foto’s.',worked:'Bij 100 foto’s stijgen de kosten met €20. Per foto is dat €0,20.'},
{q:'Een lijn in een grafiek is horizontaal op hoogte −4. Welke formule hoort erbij?',a:['x = −4','y = −4','y = −4x'],ok:1,why:'Een horizontale lijn heeft steeds dezelfde y-waarde: y=−4.',extra:'Alle punten op de lijn hebben y-coördinaat −4. x kan veranderen; y niet.',worked:'Een horizontale lijn op hoogte 3 is y=3.'}]}
]},
{id:'stories',icon:'🛠️',title:'10. Verhaalsommen',desc:'Taxi, verhuur, sparen en kosten berekenen',goal:'Je vertaalt een verhaal naar y=ax+b en rekent met de formule.',sections:[
{title:'Vaste kosten plus kosten per stuk',body:`<p>Een pretpark vraagt €5 entree en €2 per attractie. x is het aantal attracties, y het totaalbedrag.</p><div class="formula">y = 2x + 5</div><div class="tiles"><div class="tile"><b>2x</b>€2 per attractie</div><div class="tile"><b>+5</b>Vaste entree</div></div><p>De prijs per stuk hoort bij x. Het vaste bedrag betaal je ook als x=0.</p>`,qs:[
{q:'Een taxi kost €3 instapkosten en €2 per kilometer. k is de prijs in euro en d het aantal kilometer. Welke formule?',a:['k = 3d + 2','k = 2d + 3','k = 2d'],ok:1,why:'€2 per kilometer is 2d. De vaste instapkosten zijn €3. Dus k = 2d + 3.',extra:'Vraag jezelf af: wat betaal je bij 0 kilometer? Dat is €3, dus het startgetal. Elke kilometer voegt €2 toe.',worked:'Voor 10 km: k=2×10+3=€23.'},
{q:'Een verhuur kost €110 voor 3 dagen en €230 voor 7 dagen. Hoeveel kost één extra dag?',a:['€20','€30','€40'],ok:1,why:'Het verschil is €230−€110=€120 voor 7−3=4 extra dagen. Per dag is €120÷4=€30.',extra:'Je vergelijkt eerst het verschil in geld en het verschil in dagen. €120 hoort bij 4 dagen, niet bij één dag. Deel daarom door 4.',worked:'Dagprijs = (230−110)/(7−3)=120/4=€30.'}]},
{title:'Stel de formule op en gebruik hem',body:`<p>Met de verhuur uit het voorbeeld is de prijs €30 per dag plus een vast bedrag. Gebruik €110 voor 3 dagen: 110 = 30×3 + b. Dus b=20. De formule is <b>bedrag = 30 × dagen + 20</b>.</p><p>Ook als je een verhaal met kosten, winst, zakgeld of een groeiende plant krijgt, zoek je: wat verandert per stap (a) en wat is de beginwaarde (b)?</p>`,qs:[
{q:'Met bedrag = 30d + 20, wat kost 14 dagen huren?',a:['€420','€440','€450'],ok:1,why:'Bedrag=30×14+20=420+20=€440.',extra:'Vul d=14 in. Reken eerst 30×14=420 en tel daarna het vaste bedrag 20 erbij op.',worked:'Voor 7 dagen: 30×7+20=€230, dat past bij het verhaal.'},
{q:'Een foto kost Zoë €0,20 aan kosten per stuk. Ze vraagt €0,60 per foto en heeft vooraf €25 kosten gemaakt. Welke formule geeft de winst w bij n verkochte foto’s?',a:['w = 0,60n + 25','w = 0,40n − 25','w = 0,40n + 25'],ok:1,why:'Winst per foto is €0,60 − €0,20 = €0,40. De vooraf gemaakte kosten moeten eerst worden terugverdiend, dus de startwinst is −€25. w = 0,40n − 25.',extra:'Bereken eerst de winstbijdrage van één foto: verkoopprijs min kosten = 0,60−0,20=0,40. Daarna trek je de vaste €25 af.',worked:'Bij 0 verkochte foto’s is de winst −€25. Dat verklaart het minteken in de formule.'}]}
]},
{id:'slopepractice',icon:'🧠',title:'Extra. Hellingsgetal trainen',desc:'Extra veel oefenen met het hellingsgetal, van makkelijk tot uitdagend',goal:'Je leert het hellingsgetal herkennen in een formule, tabel, grafiek of twee punten.',sections:[
{title:'Level 1 — Zoek a en b',body:`<p>Bij <b>y = ax + b</b> hebben de twee getallen verschillende taken.</p><div class="tiles"><div class="tile"><b>a = hellingsgetal</b>Het getal direct vóór x. Het vertelt hoeveel y verandert als x één stap groter wordt. Het teken (+ of −) telt mee.</div><div class="tile"><b>b = startgetal</b>Het losse getal zonder x. Vul je x = 0 in, dan blijft alleen b over. Dit is waar de lijn de y-as raakt.</div></div><div class="formula">y = −1,5x + 6</div><div class="twocol"><div class="tile"><b>a = −1,5</b>De lijn daalt 1,5 per stap naar rechts.</div><div class="tile"><b>b = 6</b>De lijn start bij y = 6 als x = 0.</div></div><div class="callout warm"><b>Ezelsbrug:</b> a staat aan x vast. b begint de lijn. In y = 4x + 7 is a dus 4 en b is 7.</div>`,qs:[
{q:'Hoe groot is het hellingsgetal van y = 6x + 4?',a:['4','6','10'],ok:1,why:'Het getal vóór x is 6. Dus het hellingsgetal a = 6.',extra:'Kijk alleen naar 6x. Het losse getal +4 is het startgetal.',worked:'Bij y = 6x − 9 is het hellingsgetal óók 6.'},
{q:'Wat is het hellingsgetal van y = −2x + 7?',a:['7','2','−2'],ok:2,why:'Het getal vóór x is −2. Het minteken hoort erbij.',extra:'Een negatief hellingsgetal betekent dat de lijn daalt als je naar rechts gaat.',worked:'Bij y = −2x − 5 blijft het hellingsgetal −2.'},
{q:'Een lijn heeft formule y = 9. Wat is het hellingsgetal?',a:['9','0','1'],ok:1,why:'De lijn is horizontaal: y verandert niet als x verandert. Het hellingsgetal is 0.',extra:'Je kunt ook schrijven y = 0x + 9. Het getal vóór x is dan 0.',worked:'y = −4 is ook horizontaal en heeft hellingsgetal 0.'}]},
{title:'Level 2 — Hoeveel verandert y?',body:`<p>Het hellingsgetal vertelt hoeveel <b>y verandert als x één stap omhooggaat</b>.</p><div class="formula">a = verandering van y ÷ verandering van x</div><p>Voorbeeld: x gaat +1 en y gaat +5. Dan is a = 5. Gaat x +2 en y +6, dan is a = 6 ÷ 2 = 3.</p>`,qs:[
{q:'Als x 1 groter wordt, wordt y steeds 4 groter. Wat is a?',a:['1','4','−4'],ok:1,why:'a = verandering y ÷ verandering x = 4 ÷ 1 = 4.',extra:'Het hellingsgetal is de verandering per één stap in x.',worked:'Bij y-waarden 2, 6, 10, 14 is de stap steeds +4, dus a=4.'},
{q:'x gaat van 2 naar 6. y gaat van 3 naar 15. Wat is het hellingsgetal?',a:['3','4','12'],ok:0,why:'Δx = 6−2 = 4 en Δy = 15−3 = 12. Dus a = 12 ÷ 4 = 3.',extra:'Deel niet alleen de y-verandering door het beginpunt. Gebruik beide verschillen: (15−3) ÷ (6−2).',worked:'a = (y₂−y₁)/(x₂−x₁) = 12/4 = 3.'},
{q:'x neemt met 3 toe en y neemt met 12 af. Wat is a?',a:['4','−4','−9'],ok:1,why:'Δy = −12 en Δx = 3. Dus a = −12 ÷ 3 = −4.',extra:'Omdat y afneemt, is de verandering van y negatief. Vergeet het minteken niet.',worked:'Een dalende lijn heeft hier hellingsgetal −4.'}]},
{title:'Level 3 — Gebruik twee punten',body:`<p>Bij twee punten gebruik je altijd dezelfde volgorde:</p><ol><li>Bereken verandering x: tweede x min eerste x.</li><li>Bereken verandering y: tweede y min eerste y.</li><li>Deel verandering y door verandering x.</li></ol><div class="callout">Je mag ook de punten omwisselen, zolang je bij x én y dezelfde volgorde gebruikt.</div>`,qs:[
{q:'A(1, 4) en B(3, 10). Hoe groot is het hellingsgetal?',a:['2','3','6'],ok:1,why:'Δy = 10−4 = 6 en Δx = 3−1 = 2. Dus a = 6÷2 = 3.',extra:'Schrijf eerst de twee verschillen op. Daarna deel je de y-verandering door de x-verandering.',worked:'a = (10−4)/(3−1) = 6/2 = 3.'},
{q:'A(−2, 7) en B(2, −1). Wat is a?',a:['−2','2','−8'],ok:0,why:'Δy = −1−7 = −8. Δx = 2−(−2) = 4. Dus a = −8÷4 = −2.',extra:'Min een negatief getal aftrekken wordt optellen: 2−(−2)=4.',worked:'De lijn daalt 8 als x 4 stijgt, dus per x-stap daalt y 2.'},
{q:'Een lijn gaat door (2, 5) en (8, 5). Wat is het hellingsgetal?',a:['1','0','6'],ok:1,why:'De y-waarde verandert niet: 5−5=0. Dus a = 0÷(8−2)=0.',extra:'De lijn is horizontaal, want beide punten hebben dezelfde y-waarde.',worked:'Als Δy=0 en Δx niet 0 is, dan is het hellingsgetal 0.'}]},
{title:'Level 4 — Mini-eindbaas 👾',body:`<p>Nu moet je zelf herkennen welke informatie belangrijk is. Denk rustig na: <b>hoeveel verandert y, gedeeld door hoeveel x verandert?</b></p>`,qs:[
{q:'Een lijn gaat door (−1, −2) en (3, 10). Wat is het hellingsgetal?',a:['3','4','12'],ok:0,why:'Δy = 10−(−2)=12. Δx = 3−(−1)=4. Dus a=12÷4=3.',extra:'Let op de mintekens: 10−(−2)=12 en 3−(−1)=4.',worked:'a=(10−(−2))/(3−(−1))=12/4=3.'},
{q:'Bij x=1 is y=8 en bij x=5 is y=0. Wat is a?',a:['−2','2','−8'],ok:0,why:'Δy = 0−8 = −8. Δx = 5−1 = 4. Dus a=−8÷4=−2.',extra:'De lijn daalt, dus het hellingsgetal is negatief. Deel −8 door 4.',worked:'a=(0−8)/(5−1)=−8/4=−2.'},
{q:'Een lijn stijgt 15 als x 5 groter wordt. Wat is het hellingsgetal?',a:['15','5','3'],ok:2,why:'a = verandering y ÷ verandering x = 15 ÷ 5 = 3.',extra:'Het hellingsgetal is niet de totale stijging 15, maar de stijging per één x-stap.',worked:'Als x 1 stijgt, stijgt y gemiddeld 3.'}]}
]},
{id:'mixed',icon:'🏁',title:'11. Gemengde toets',desc:'Alles door elkaar, zoals in een oefentoets',goal:'Je kiest zelf de juiste aanpak bij gemengde opgaven.',sections:[
{title:'Kies de passende aanpak',body:`<p>In een toets vertelt de vraag niet altijd welke regel je moet gebruiken. Bepaal eerst wat er gegeven is: een tabel, formule, grafiek, twee punten of een verhaal.</p><div class="callout"><b>Mini-stappenplan:</b><ol><li>Wat weet ik?</li><li>Wat moet ik vinden?</li><li>Welke verandering of startwaarde kan ik aflezen?</li><li>Reken uit en controleer je antwoord.</li></ol></div>`,qs:[
{q:'Welke van deze vergelijkingen geeft een verticale lijn?',a:['y = 4 − 2x','y = x + 6','x = 6'],ok:2,why:'x=6 beschrijft alle punten met dezelfde x-coördinaat: een verticale lijn.',extra:'Een verticale lijn heeft de vorm x=getal. Formules die met y= beginnen beschrijven hier horizontale of schuine lijnen.',worked:'x = −2 is ook verticaal; y = −2 is horizontaal.'},
{q:'Gegeven y = 8x − 12. Zijn x en y recht evenredig?',a:['Ja, want het is lineair','Nee, want het startgetal is −12','Ja, want het hellingsgetal is 8'],ok:1,why:'Recht evenredig moet de vorm y=ax hebben, zonder los startgetal. Hier is b=−12.',extra:'De formule is wel lineair, maar niet recht evenredig. Bij x=0 is y=−12, dus de lijn gaat niet door de oorsprong.',worked:'y=8x is recht evenredig. y=8x−12 is lineair maar niet recht evenredig.'}]},
{title:'Laat zien wat je weet',body:`<p>Je hoeft niet alles direct te weten. Denk terug aan de geheugensteun en probeer de laatste vragen zelfstandig.</p><div class="goal"><b>Je kunt dit nu stap voor stap:</b> een tabel controleren, a en b vinden, richtingen benoemen, grafieken interpreteren en een formule opstellen.</div>`,qs:[
{q:'Een lijn gaat door (2, 1) en (16, 8). Wat is het hellingsgetal?',a:['0,5','2','7'],ok:0,why:'Δx=16−2=14 en Δy=8−1=7. Dus a=7÷14=0,5.',extra:'Let op: de verandering van x is 14 en van y is 7. Je deelt 7 door 14, niet andersom.',worked:'a=Δy/Δx=7/14=0,5.'},
{q:'De lijn heeft formule y = −3x + 22. Welk punt ligt NIET op de lijn?',a:['(6, 4)','(6, 8)','(2, 16)'],ok:1,why:'Bij x=6 is y=−18+22=4, dus (6,4) klopt. Bij x=2 is y=−6+22=16, dus (2,16) klopt ook. (6,8) klopt niet.',extra:'Vul de x-waarde in. Voor x=6 moet y=4 zijn, niet 8. Voor x=2 wordt y=16. Daarom is alleen (6,8) niet op de lijn.',worked:'Een punt ligt op de lijn als de ingevulde x en y de formule waar maken.'}]}
]}
];

function drawLine(id,a,b){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d'),w=c.width,hh=c.height,xmin=-8,xmax=8,ymin=-8,ymax=8,sx=w/(xmax-xmin),sy=hh/(ymax-ymin),X=x=>(x-xmin)*sx,Y=y=>hh-(y-ymin)*sy;ctx.clearRect(0,0,w,hh);ctx.lineWidth=1;ctx.strokeStyle='#e4ebf4';for(let x=xmin;x<=xmax;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),hh);ctx.stroke()}for(let y=ymin;y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(w,Y(y));ctx.stroke()}ctx.strokeStyle='#677c93';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),hh);ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.stroke();ctx.fillStyle='#5e728a';ctx.font='13px system-ui';for(let x=xmin;x<=xmax;x+=2)ctx.fillText(x,X(x)+3,Y(0)+15);for(let y=ymin;y<=ymax;y+=2)if(y!==0)ctx.fillText(y,X(0)+5,Y(y)-3);ctx.strokeStyle='#dc5b62';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(X(xmin),Y(a*xmin+b));ctx.lineTo(X(xmax),Y(a*xmax+b));ctx.stroke();ctx.fillStyle='#c03945';ctx.beginPath();ctx.arc(X(0),Y(b),6,0,Math.PI*2);ctx.fill()}

function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffleCopy(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderLevels(){view='levels';const total=getLevelScore(),passed=getHighestPassed(),reward=getRewardText();app.innerHTML=`<section class="card"><div class="eyebrow">De Helling Hero-route</div><h2>10 levels. Eén master. 💫</h2><p>Levels gaan van basiskennis naar pittige toepassingsvragen. Je haalt een level met <b>70 punten of meer van de 100</b>. Lukt het nog niet? Dan mag je het opnieuw proberen. Je beste score blijft bewaard.</p><div class="levelhero"><div class="leveltop"><span class="badge">🏅 Hoogste behaalde niveau: ${passed}/10</span><span class="scorepill">💰 ${reward} / € 10,00</span></div><div class="levelhero-grid"><div class="levelstat"><b>${total}</b><span class="small">totaal punten</span></div><div class="levelstat"><b>${stats.levelUnlocked}/10</b><span class="small">levels ontgrendeld</span></div><div class="levelstat"><b>${Object.values(stats.levelPassed).filter(Boolean).length}/10</b><span class="small">levels behaald</span></div></div><div class="progress"><span style="width:${total/10}%"></span></div></div><div class="levelgrid">${LEVELS.map(l=>{const unlocked=l.id<=stats.levelUnlocked,done=!!stats.levelPassed[l.id],pts=Number(stats.levelScores[l.id])||0;return `<div class="levelcard ${unlocked?'':'locked'}"><div class="levelnum">${done?'✓':l.id}</div><div class="levelmeta"><strong>${escapeHtml(l.name)}</strong><span class="small">${escapeHtml(l.tagline)}</span><span class="small" style="margin-top:5px">${done?'✅ Behaald':unlocked?'🔓 Speelbaar':'🔒 Eerst level '+(l.id-1)+' halen'} · Beste: ${pts}/100</span>${unlocked?`<button class="${done?'secondary':'primary'}" data-play-level="${l.id}">${done?'Opnieuw oefenen':'Start level '+l.id}</button>`:''}</div></div>`}).join('')}</div><div class="callout warm"><b>Hoe verdien je punten?</b><br>Elke vraag is maximaal 20 punten waard: in één keer goed = 20, in één keer goed met hint = 15, goed bij de tweede poging = 10, daarna of bij overslaan 0. Er zijn geen minpunten, maar gokken levert dus weinig op. De beste score van elk level telt mee.</div><div class="buttonrow"><button class="primary" id="levelsReport">📋 Scorekaart voor papa</button><button class="quiet" id="levelsHome">← Terug naar start</button></div></section>`;document.querySelectorAll('[data-play-level]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.playLevel)));document.getElementById('levelsReport').onclick=renderParentReport;document.getElementById('levelsHome').onclick=()=>setView('home')}
let activeLevel=null,levelRunQuestions=[],levelQuestionIndex=0,levelQuestionAttempts=0,levelHintShown=false,levelQuestionLocked=false,levelRunPoints=0,levelRunCorrect=0,levelFirstTryCorrect=0,levelRunSkipped=0,easyPracticeSet=null,easyPracticeIndex=0,easyPracticeLocked=false;
function startLevel(id){if(id>stats.levelUnlocked){toast('Haal eerst het vorige level!');return}activeLevel=LEVELS[id-1];levelRunQuestions=shuffleCopy(activeLevel.questions);levelQuestionIndex=0;levelRunPoints=0;levelRunCorrect=0;levelFirstTryCorrect=0;levelRunSkipped=0;easyPracticeSet=null;renderLevelQuestion()}
function renderLevelQuestion(){view='levelgame';window.scrollTo(0,0);const q=levelRunQuestions[levelQuestionIndex];levelQuestionAttempts=0;levelHintShown=false;levelQuestionLocked=false;easyPracticeSet=null;const answered=levelQuestionIndex;app.innerHTML=`<section class="card"><div class="leveltop"><span class="badge">🏆 Level ${activeLevel.id}/10 · ${escapeHtml(activeLevel.name)}</span><span class="scorepill">⭐ ${levelRunPoints} punten deze ronde</span></div><div class="progress"><span style="width:${answered/levelRunQuestions.length*100}%"></span></div><div class="question-progress-note">Vraag ${answered+1} van ${levelRunQuestions.length} · maximaal 100 punten per level</div><div class="brainprompt"><span class="mission-tag">🧠 Eerst zelf denken</span><div><b>Missie:</b> ${escapeHtml(activeLevel.skill)}</div><div class="small" style="margin-top:5px">Tip voor dit level: ${escapeHtml(activeLevel.tip)}</div></div>${q.reminder?`<div class="callout warm"><b>Onthoud:</b> ${escapeHtml(q.reminder)}</div>`:''}<h2>${escapeHtml(q.prompt)}</h2><div id="levelAnswerArea">${q.type==='choice'?`<div class="answers">${shuffleCopy(q.options.map((_,i)=>i)).map((i,k)=>`<button class="answer" data-level-choice="${i}"><span class="letter">${String.fromCharCode(65+k)}</span><span>${escapeHtml(q.options[i])}</span></button>`).join('')}</div>`:`<div class="level-input-row"><button class="secondary" id="levelMinus" type="button" aria-label="Minteken aan of uit">±</button><input id="levelAnswerInput" type="text" inputmode="decimal" autocomplete="off" aria-label="Jouw antwoord" placeholder="Typ je antwoord…"><button class="primary" id="submitLevelAnswer">Controleer ✓</button></div><p class="small">Gebruik de ±-knop voor een minteken en een komma bij decimalen. Vul alleen het getal in.</p>`}</div><div class="buttonrow no-print"><button class="quiet" id="levelHintButton">💡 Geef me een hint</button><button class="secondary" id="levelEasierButton">🧩 Makkelijkere vragen</button><button class="quiet" id="levelSkipButton">⏭️ Overslaan</button><button class="quiet" id="levelExitButton">← Levels bekijken</button></div><div id="levelHintArea"></div><div id="levelEasierArea"></div><div id="levelFeedback" aria-live="polite"></div></section>`;if(q.type==='choice'){document.querySelectorAll('[data-level-choice]').forEach(b=>b.onclick=()=>submitLevelAnswer(Number(b.dataset.levelChoice)))}else{const input=document.getElementById('levelAnswerInput');document.getElementById('submitLevelAnswer').onclick=()=>submitLevelAnswer(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')submitLevelAnswer(input.value)});document.getElementById('levelMinus').onclick=()=>{const v=input.value.trim();input.value=/^[-−]/.test(v)?v.slice(1):'-'+v;input.focus()};}document.getElementById('levelHintButton').onclick=showLevelHint;document.getElementById('levelEasierButton').onclick=showEasierQuestions;document.getElementById('levelSkipButton').onclick=skipLevelQuestion;document.getElementById('levelExitButton').onclick=renderLevels;if(q.type!=='choice')document.getElementById('levelAnswerInput').focus({preventScroll:true})}
function showLevelHint(){if(levelQuestionLocked)return;levelHintShown=true;const q=levelRunQuestions[levelQuestionIndex];const box=document.getElementById('levelHintArea');box.innerHTML=`<div class="hintsteps"><b>💡 Hint — doe het stap voor stap</b><p>${escapeHtml(q.hint)}</p>${q.worked?`<details><summary><b>Laat de volledige rekenstappen zien</b></summary><p>${escapeHtml(q.worked)}</p></details>`:''}<p class="small">Een hint gebruiken is slim. Met hint is een goed antwoord nog 15 punten waard.</p></div>`;document.getElementById('levelHintButton').textContent='💡 Hint bekeken';}
function easierPracticeForLevel(id){
 const sets={
  1:{title:'Oefen: welke is a en welke is b?',intro:'Kijk naar y = ax + b. Het getal vóór x is a. Het losse getal is b; bij x = 0 blijft b over.',questions:[
   {prompt:'In y = 3x + 4, wat is het hellingsgetal a?',options:['3','4','7'],answer:0,explain:'a = 3, want 3 staat direct vóór x.'},
   {prompt:'In y = 3x + 4, wat is het startgetal b?',options:['3','4','0'],answer:1,explain:'b = 4. Bij x = 0 wordt 3 × 0 = 0 en blijft y = 4 over.'},
   {prompt:'In y = −1,5x + 6, wat is het startgetal b?',options:['−1,5','6','4,5'],answer:1,explain:'b = 6. Dit is de y-waarde bij x = 0.'}
  ]},
  2:{title:'Oefen: wat doet het hellingsgetal?',intro:'a vertelt hoe y verandert bij één stapje extra in x. Een positief getal betekent omhoog; een negatief getal betekent omlaag.',questions:[
   {prompt:'Bij y = 2x + 3 wordt x één groter. Wat gebeurt er met y?',options:['y wordt 2 groter','y wordt 3 groter','y blijft gelijk'],answer:0,explain:'a = 2. Dus bij x +1 wordt y +2.'},
   {prompt:'Bij y = −3x + 8 wordt x één groter. Wat gebeurt er met y?',options:['y wordt 3 groter','y wordt 3 kleiner','y blijft gelijk'],answer:1,explain:'a = −3. Het minteken betekent dalen: y wordt 3 kleiner.'},
   {prompt:'Bij y = −1,5x + 6: x gaat van 0 naar 1. Wat gebeurt er met y?',options:['van 6 naar 7,5: +1,5','van 6 naar 4,5: −1,5','y blijft 6'],answer:1,explain:'Bij x=0 is y=6. Bij x=1 is y=−1,5+6=4,5. Het verschil is 4,5−6=−1,5.'}
  ]},
  3:{title:'Oefen: vul x in',intro:'Vervang x door het gegeven getal. Reken eerst a × x uit en tel daarna b erbij op.',questions:[
   {prompt:'Bij y = 2x + 1, wat is y als x = 1?',options:['2','3','1'],answer:1,explain:'y = 2 × 1 + 1 = 3.'},
   {prompt:'Bij y = 3x + 2, wat is y als x = 2?',options:['5','6','8'],answer:2,explain:'y = 3 × 2 + 2 = 8.'},
   {prompt:'Bij y = −x + 5, wat is y als x = 1?',options:['4','5','6'],answer:0,explain:'y = −1 + 5 = 4.'}
  ]},
  4:{title:'Oefen: vaste stapjes in een tabel',intro:'Bij een vaste x-stap vind je a door de verandering van y te delen door de verandering van x.',questions:[
   {prompt:'x wordt +1 en y wordt +2. Wat is a?',options:['1','2','3'],answer:1,explain:'a = 2 ÷ 1 = 2.'},
   {prompt:'x wordt +2 en y wordt +4. Wat is a?',options:['2','4','8'],answer:0,explain:'a = 4 ÷ 2 = 2.'},
   {prompt:'x wordt +1 en y wordt −3. Wat is a?',options:['3','−3','−2'],answer:1,explain:'a = −3 ÷ 1 = −3.'}
  ]},
  5:{title:'Oefen: recht evenredig',intro:'Een recht evenredige formule heeft y = ax. Er is geen startgetal dat nog bij de formule wordt opgeteld.',questions:[
   {prompt:'Welke formule is recht evenredig?',options:['y = 4x','y = 4x + 2','y = 4'],answer:0,explain:'y = 4x heeft b = 0.'},
   {prompt:'Bij y = 3x, wat is y als x = 2?',options:['5','6','3'],answer:1,explain:'y = 3 × 2 = 6.'},
   {prompt:'Wat moet b zijn voor recht evenredig?',options:['0','1','Hetzelfde als a'],answer:0,explain:'Bij y = ax is er geen los startgetal: b = 0.'}
  ]},
  6:{title:'Oefen: startpunt op de y-as',intro:'Waar de lijn de y-as raakt, is x = 0. De y-waarde daar is het startgetal b.',questions:[
   {prompt:'Bij y = 2x + 5, wat is y als x = 0?',options:['2','5','7'],answer:1,explain:'2 × 0 + 5 = 5, dus b = 5.'},
   {prompt:'Waar snijdt y = −x + 3 de y-as?',options:['(0, 3)','(3, 0)','(0, −1)'],answer:0,explain:'Op de y-as is x = 0; dan is y = 3.'},
   {prompt:'Een lijn start bij y = −2. Wat is b?',options:['2','0','−2'],answer:2,explain:'Het startgetal is de y-waarde bij x = 0: b = −2.'}
  ]},
  7:{title:'Oefen: twee punten',intro:'Reken eerst de twee verschillen uit. Deel daarna verandering y door verandering x.',questions:[
   {prompt:'x gaat +1 en y gaat +2. Wat is a?',options:['1','2','3'],answer:1,explain:'a = 2 ÷ 1 = 2.'},
   {prompt:'A(0, 1) en B(2, 5). Wat is a?',options:['2','3','4'],answer:0,explain:'Δy = 5−1=4 en Δx=2−0=2. a=4÷2=2.'},
   {prompt:'A(1, 4) en B(2, 2). Wat is a?',options:['2','−2','−1'],answer:1,explain:'Δy=2−4=−2 en Δx=2−1=1. a=−2.'}
  ]},
  8:{title:'Oefen: vind startgetal b',intro:'Als je a weet en een punt kent, vul dat punt in y = ax + b in. Als x = 0, lees je b meteen af.',questions:[
   {prompt:'y = 2x + b en het punt (0, 5) ligt op de lijn. Wat is b?',options:['2','0','5'],answer:2,explain:'Bij x=0 blijft y=b, dus b=5.'},
   {prompt:'a = 3 en het punt (1, 5) ligt op de lijn. Wat is b?',options:['2','3','5'],answer:0,explain:'5 = 3×1+b, dus b=2.'},
   {prompt:'y = 2x + b. Bij x=2 is y=7. Wat is b?',options:['3','5','7'],answer:0,explain:'7=2×2+b, dus b=3.'}
  ]},
  9:{title:'Oefen: startkosten en verandering',intro:'Bij een verhaal is a meestal het bedrag per stap en b het bedrag dat je meteen betaalt of waarmee je begint.',questions:[
   {prompt:'Een ritje kost €3 en er is €2 vaste entree. x is het aantal ritjes. Welke formule geeft de kosten y?',options:['y = 3x + 2','y = 2x + 3','y = 5x'],answer:0,explain:'€3 per ritje is 3x. De vaste entree is +2.'},
   {prompt:'Je start met €10 en spaart €4 per week. Wat is het startgetal?',options:['4','10','14'],answer:1,explain:'Je hebt al €10 bij week 0. Dus b=10.'},
   {prompt:'€5 per uur en geen startkosten: welke formule?',options:['y = 5x','y = x + 5','y = 5x + 1'],answer:0,explain:'De verandering is 5 per uur en het startgetal is 0.'}
  ]},
  10:{title:'Oefen: bouw de basis op',intro:'Splits de opdracht: vind a, vind b en controleer daarna de formule.',questions:[
   {prompt:'In y = 2x + 4, wat is a?',options:['2','4','6'],answer:0,explain:'a is het getal vóór x, dus 2.'},
   {prompt:'In y = 2x + 4, wat is b?',options:['2','4','6'],answer:1,explain:'b is het startgetal, dus 4.'},
   {prompt:'Bij y = 2x + 4 en x = 1, wat is y?',options:['6','2','4'],answer:0,explain:'y=2×1+4=6.'}
  ]}
 };
 return sets[id]||sets[2];
}
function showEasierQuestions(){if(levelQuestionLocked)return;easyPracticeSet=easierPracticeForLevel(activeLevel.id);easyPracticeIndex=0;renderEasierQuestion();const area=document.getElementById('levelEasierArea');if(area)area.scrollIntoView({behavior:'smooth',block:'nearest'});}
function renderEasierQuestion(){const area=document.getElementById('levelEasierArea');if(!area||!easyPracticeSet)return;easyPracticeLocked=false;const q=easyPracticeSet.questions[easyPracticeIndex];area.innerHTML=`<div class="level-guidance"><div class="easyq-progress">🧩 OEFENMODUS · Vraag ${easyPracticeIndex+1} van ${easyPracticeSet.questions.length}</div><h3>${escapeHtml(easyPracticeSet.title)}</h3><p>${escapeHtml(easyPracticeSet.intro)}</p><p><b>${escapeHtml(q.prompt)}</b></p><div class="easyq-options">${q.options.map((o,i)=>`<button class="easyq-option" data-easy-choice="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join('')}</div><div id="easyPracticeFeedback" aria-live="polite"></div><p class="small">Deze oefenvraag geeft geen levelpunten en kost je geen punten. Oefen eerst rustig, ga daarna terug naar de hoofdvraag om punten te verdienen.</p><div class="buttonrow"><button class="quiet" id="closeEasyPractice">↩ Terug naar de oorspronkelijke vraag</button></div></div>`;area.querySelectorAll('[data-easy-choice]').forEach(b=>b.onclick=()=>checkEasierAnswer(Number(b.dataset.easyChoice)));document.getElementById('closeEasyPractice').onclick=closeEasierPractice;}
function checkEasierAnswer(choice){if(easyPracticeLocked)return;const q=easyPracticeSet.questions[easyPracticeIndex],fb=document.getElementById('easyPracticeFeedback');if(choice!==q.answer){const buttons=[...document.querySelectorAll('[data-easy-choice]')];buttons.forEach((b,i)=>{b.classList.remove('wrongchoice');if(i===choice)b.classList.add('wrongchoice')});fb.innerHTML=`<div class="level-feedback bad"><b>Bijna — probeer gerust nog eens.</b><p>${escapeHtml(q.options[choice])} is nog niet juist. Denk aan de uitleg bovenaan. Geen strafpunten!</p></div>`;return}easyPracticeLocked=true;document.querySelectorAll('[data-easy-choice]').forEach((b,i)=>{b.disabled=true;if(i===choice)b.classList.add('correctchoice')});fb.innerHTML=`<div class="level-feedback good"><b>✅ Goed gezien!</b><p>${escapeHtml(q.explain)}</p><div class="buttonrow"><button class="primary" id="easyNext">${easyPracticeIndex===easyPracticeSet.questions.length-1?'Terug naar de hoofdvraag':'Volgende makkelijke vraag →'}</button></div></div>`;document.getElementById('easyNext').onclick=()=>{if(easyPracticeIndex<easyPracticeSet.questions.length-1){easyPracticeIndex++;renderEasierQuestion()}else closeEasierPractice()};}
function closeEasierPractice(){const area=document.getElementById('levelEasierArea');if(area)area.innerHTML='';easyPracticeSet=null;}
function skipLevelQuestion(){if(levelQuestionLocked)return;levelQuestionLocked=true;levelRunSkipped++;document.querySelectorAll('[data-level-choice]').forEach(b=>b.disabled=true);const input=document.getElementById('levelAnswerInput');if(input)input.disabled=true;const submit=document.getElementById('submitLevelAnswer');if(submit)submit.disabled=true;document.getElementById('levelHintButton').disabled=true;document.getElementById('levelEasierButton').disabled=true;document.getElementById('levelSkipButton').disabled=true;const q=levelRunQuestions[levelQuestionIndex];const fb=document.getElementById('levelFeedback');fb.innerHTML=`<div class="level-feedback"><b>⏭️ Vraag overgeslagen — dat mag.</b><p>Voor deze vraag krijg je geen punten, maar er gaan ook geen punten af. Je kunt dit onderwerp later oefenen bij de makkelijke vragen of in de losse lessen.</p><details><summary><b>Bekijk het antwoord en de uitleg</b></summary><p>${escapeHtml(q.explain||'Bekijk de hint voor een eerste stap.')}</p>${q.worked?`<p>${escapeHtml(q.worked)}</p>`:''}</details></div><div class="buttonrow"><button class="primary" id="nextAfterSkip">${levelQuestionIndex===levelRunQuestions.length-1?'Bekijk mijn levelscore':'Volgende vraag →'}</button></div>`;document.getElementById('nextAfterSkip').onclick=()=>{if(levelQuestionIndex<levelRunQuestions.length-1){levelQuestionIndex++;renderLevelQuestion()}else finishLevel()};}

function submitLevelAnswer(value){if(levelQuestionLocked)return;const q=levelRunQuestions[levelQuestionIndex];let correct=false;if(q.type==='choice'){correct=Number(value)===q.answer}else{const normalized=String(value??'').trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(',','.');if(normalized===''){toast('Vul eerst een getal in.');return}const parsed=normalized===''?NaN:Number(normalized);correct=Number.isFinite(parsed)&&Math.abs(parsed-q.answer)<=((q.tolerance??0.01));}const feedback=document.getElementById('levelFeedback');if(!correct){levelQuestionAttempts++;if(q.type==='choice'){document.querySelectorAll('[data-level-choice]').forEach(b=>{if(Number(b.dataset.levelChoice)===Number(value)){b.classList.add('wrongchoice');b.disabled=true}})}else{const input=document.getElementById('levelAnswerInput');if(input){input.classList.add('wrongchoice');input.setAttribute('aria-invalid','true')}}feedback.innerHTML=`<div class="level-feedback bad"><b>🔄 Nog niet — probeer het opnieuw.</b><p>Er gaan geen punten af, maar bij een tweede poging is deze vraag nog 10 punten waard. Kijk nog eens naar de vraag en gebruik gerust een hint.</p><p class="small">${levelQuestionAttempts===1?'Denk aan de betekenis van de formule.': 'Splits het in kleine stapjes en controleer de tekens.'}</p></div>`;return}
levelQuestionLocked=true;let earned=levelQuestionAttempts===0?(levelHintShown?15:20):levelQuestionAttempts===1?10:0;levelRunPoints+=earned;const scorePill=document.querySelector('.scorepill');if(scorePill)scorePill.textContent='⭐ '+levelRunPoints+' punten deze ronde';levelRunCorrect++;if(earned>0)celebrate('good');else playSound('soft');if(levelQuestionAttempts===0&&!levelHintShown)levelFirstTryCorrect++;stats.good=(stats.good||0)+1;stats.total=(stats.total||0)+levelQuestionAttempts+1;saveStats();if(q.type==='choice')document.querySelectorAll('[data-level-choice]').forEach(b=>{b.disabled=true;if(Number(b.dataset.levelChoice)===q.answer)b.classList.add('correctchoice')});else{const input=document.getElementById('levelAnswerInput');if(input){input.disabled=true;input.classList.remove('wrongchoice');input.removeAttribute('aria-invalid')}document.getElementById('submitLevelAnswer').disabled=true}document.getElementById('levelHintButton').disabled=true;document.getElementById('levelEasierButton').disabled=true;document.getElementById('levelSkipButton').disabled=true;feedback.innerHTML=`<div class="level-feedback good"><b>✅ Goed gedaan! +${earned} punten</b><p>${escapeHtml(q.explain)}</p>${q.worked?`<p><b>Zo reken je het uit:</b> ${escapeHtml(q.worked)}</p>`:''}<p class="small">${levelQuestionAttempts===0&&!levelHintShown?'Zelfstandig bij de eerste poging — top!':levelQuestionAttempts===0?'Goed dat je een hint gebruikte.': 'Je hebt de feedback gebruikt en bent doorgegaan. Dat is leren!'}</p></div><div class="buttonrow"><button class="primary" id="nextLevelQuestion">${levelQuestionIndex===levelRunQuestions.length-1?'Bekijk mijn levelscore':'Volgende uitdaging →'}</button></div>`;document.getElementById('nextLevelQuestion').onclick=()=>{if(levelQuestionIndex<levelRunQuestions.length-1){levelQuestionIndex++;renderLevelQuestion()}else finishLevel()}}
function finishLevel(){const id=activeLevel.id;const prior=Number(stats.levelScores[id])||0;stats.levelScores[id]=Math.max(prior,Math.min(100,levelRunPoints));const passed=levelRunPoints>=70;stats.levelPassed[id]=!!stats.levelPassed[id]||passed;if(passed)stats.levelUnlocked=Math.min(10,Math.max(stats.levelUnlocked,id+1));const today=new Date().toISOString().slice(0,10);if(stats.lastDay!==today){const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);stats.streak=stats.lastDay===yesterday?(stats.streak||0)+1:1;stats.lastDay=today}saveStats();renderLevelResult(passed,prior);if(passed)celebrate('win');else playSound('soft')}
function renderLevelResult(passed,prior){view='levelresult';const score=levelRunPoints,best=Number(stats.levelScores[activeLevel.id])||0,all=getLevelScore(),reward=getRewardText();app.innerHTML=`<section class="card sectionend"><div class="milestone">${passed?'🏆':'🌱'}</div><div class="eyebrow">${passed?'Level behaald!':'Training afgerond'}</div><h2>${passed?activeLevel.id===10?'HELLING HERO! Jij hebt alle levels gehaald!':'Je hebt level '+activeLevel.id+' gehaald!':'Nog één trainingsronde en je kunt verder'}</h2><p>${passed?'Je hebt de grens van 70 punten gehaald. Je mag door naar de volgende uitdaging.':`Je haalde ${score}/100 punten. Voor dit level heb je 70 punten nodig om het volgende te ontgrendelen. Je kunt het opnieuw proberen; je beste score blijft staan.`}</p><div class="levelhero"><div class="levelhero-grid"><div class="levelstat"><b>${score}/100</b><span class="small">deze ronde</span></div><div class="levelstat"><b>${best}/100</b><span class="small">beste score</span></div><div class="levelstat"><b>${levelRunCorrect}/5</b><span class="small">vragen goed</span></div></div><div class="progress"><span style="width:${score}%"></span></div><p><b>Totaalscore:</b> ${all}/1000 punten · <b>Beloning volgens afspraak:</b> ${reward} van € 10,00</p></div><div class="callout ${passed?'good':'warm'}"><b>${passed?'Wat goed werkte:':'Slimme volgende stap:'}</b><br>${levelFirstTryCorrect} van de 5 vragen goed zonder fout of hint. ${levelRunSkipped?`Je hebt ${levelRunSkipped} ${levelRunSkipped===1?'vraag':'vragen'} overgeslagen; die leveren geen punten op, maar ook geen strafpunten.`:''} ${passed?'Je kunt later terugkomen om je beste score te verbeteren.':'Bekijk de uitleg, doe even iets anders en probeer daarna nog eens. Herhalen helpt je het echt te onthouden.'}</div><div class="buttonrow" style="justify-content:center"><button class="primary" id="repeatLevel">${passed?'Score verbeteren':'Nog een poging'}</button>${passed&&activeLevel.id<10?`<button class="secondary" id="nextLevel">Start level ${activeLevel.id+1} →</button>`:''}<button class="secondary" id="resultLevels">Alle levels</button><button class="quiet" id="resultReport">Scorekaart voor papa</button></div></section>`;document.getElementById('repeatLevel').onclick=()=>startLevel(activeLevel.id);if(passed&&activeLevel.id<10)document.getElementById('nextLevel').onclick=()=>startLevel(activeLevel.id+1);document.getElementById('resultLevels').onclick=renderLevels;document.getElementById('resultReport').onclick=renderParentReport}
function buildParentReport(){const d=new Date().toLocaleDateString('nl-NL');const total=getLevelScore(),best=getHighestPassed(),money=Math.min(10,total/100).toLocaleString('nl-NL',{style:'currency',currency:'EUR'});const lines=['HELLING HERO — SCOREKAART VOOR OUDER','Naam: '+(stats.playerName||'niet ingevuld'),'Datum: '+d,'Hoogste behaalde level: '+best+'/10','Eindscore (beste score per level): '+total+'/1000 punten','Beloning volgens onze afspraak: '+money+' / € 10,00','', 'SCORES PER LEVEL',...LEVELS.map(l=>`Level ${l.id} — ${l.name}: ${Number(stats.levelScores[l.id])||0}/100 punten — ${stats.levelPassed[l.id]?'BEHAALD':'nog oefenen'}`),'','Rekenregel: 100 punten = € 1,00; maximaal 1000 punten = € 10,00.','Dit bedrag is een scoreberekening; ouder en kind bepalen samen de uiteindelijke beloning.'];return lines.join('\n')}
function renderParentReport(){view='parent';const score=getLevelScore(),reward=getRewardText(),passed=getHighestPassed();app.innerHTML=`<section class="card"><div class="eyebrow">Ouderweergave</div><h2>Scorekaart voor papa 📋</h2><p>Dit overzicht gebruikt de beste score van elk level. Zo telt opnieuw oefenen mee als verbetering, maar kan een level niet onbeperkt punten opleveren.</p><div class="searchrow no-print" style="margin:14px 0"><label for="playerName" style="width:100%;font-weight:750">Naam leerling (optioneel)</label><input id="playerName" maxlength="50" placeholder="Vul je naam in" value="${escapeHtml(stats.playerName)}"></div><div class="levelhero"><div class="leveltop"><span class="badge">🏅 Hoogste behaalde niveau: ${passed}/10</span><span class="scorepill">💶 ${reward} / € 10,00</span></div><div class="levelhero-grid"><div class="levelstat"><b>${score}/1000</b><span class="small">eindscore</span></div><div class="levelstat"><b>${passed}/10</b><span class="small">hoogste level gehaald</span></div><div class="levelstat"><b>${Object.values(stats.levelPassed).filter(Boolean).length}/10</b><span class="small">levels behaald</span></div></div><div class="progress"><span style="width:${score/10}%"></span></div></div><h3>Resultaten per level</h3><div class="level-report">${LEVELS.map(l=>`<div class="reportrow"><span class="report-label">${l.id}. ${escapeHtml(l.name)}</span><span>${Number(stats.levelScores[l.id])||0}/100</span><span class="${stats.levelPassed[l.id]?'earned':''}">${stats.levelPassed[l.id]?'✓ Behaald':'Oefenen'}</span></div>`).join('')}</div><div class="callout warm"><b>Beloningsafspraak</b><br>Elke 100 punten is € 1,00. De score wordt berekend uit de beste score op ieder level: maximaal 1000 punten en dus maximaal € 10,00. Spreek vooraf samen af of en wanneer het bedrag wordt uitbetaald.</div><div class="callout"><b>Let op bij verschillende apparaten</b><br>De app bewaart de voortgang lokaal in de browser. De score synchroniseert niet vanzelf tussen iPhone en laptop. Gebruik hieronder delen, downloaden of afdrukken om de scorekaart aan papa te laten zien.</div><div class="buttonrow no-print"><button class="primary" id="shareParentReport">📤 Deel score met papa</button><button class="secondary" id="downloadParentReport">⬇ Download scorekaart</button><button class="secondary" id="printParentReport">🖨️ Print / bewaar als PDF</button><button class="quiet" id="parentBackLevels">← Naar levels</button></div></section>`;document.getElementById('playerName').addEventListener('input',e=>{stats.playerName=e.target.value.slice(0,50);saveStats()});document.getElementById('shareParentReport').onclick=shareParentReport;document.getElementById('downloadParentReport').onclick=downloadParentReport;document.getElementById('printParentReport').onclick=()=>window.print();document.getElementById('parentBackLevels').onclick=renderLevels}
async function shareParentReport(){const textReport=buildParentReport();if(navigator.share){try{await navigator.share({title:'Helling Hero-scorekaart',text:textReport});return}catch(e){if(e&&e.name==='AbortError')return}}try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(textReport);toast('Scorekaart gekopieerd. Plak hem in een bericht aan papa.');return}}catch(e){}const ta=document.createElement('textarea');ta.value=textReport;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)toast('Scorekaart gekopieerd. Plak hem in een bericht aan papa.');else toast('Gebruik Download scorekaart of Print / bewaar als PDF.')}
function downloadParentReport(){const blob=new Blob([buildParentReport()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HellingHero-scorekaart.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function drawStaticGraphs(){drawLine('sampleGraph',2,1);drawLine('readGraph',1,2)}
document.getElementById('navHome').onclick=()=>setView('home');document.getElementById('navLevels').onclick=()=>setView('levels');document.getElementById('mLevels').onclick=()=>setView('levels');document.getElementById('navMix').onclick=startMix;document.getElementById('navGraph').onclick=()=>setView('graph');document.getElementById('navProgress').onclick=()=>setView('progress');document.getElementById('mHome').onclick=()=>setView('home');document.getElementById('mMix').onclick=startMix;document.getElementById('mGraph').onclick=()=>setView('graph');document.getElementById('mProgress').onclick=()=>setView('progress');
// ---- Confetti en geluid ----
let audioCtx=null;
function soundOn(){return stats.sound!==false}
function tone(freq,start,dur,vol=0.18,type='sine'){const t=audioCtx.currentTime+start,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.05)}
function playSound(kind){if(!soundOn())return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(kind==='good'){tone(660,0,.14);tone(990,.09,.22)}else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,.2,'triangle'));tone(1319,.5,.5,.16,'triangle')}else if(kind==='soft'){tone(330,0,.18,.08,'triangle')}}catch(e){}}
let confettiParts=[],confettiRunning=false;
function confetti(amount=60){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#376ce0','#4ebc92','#ffdf91','#f2789a','#7152b8','#ff9f43'],now=performance.now();for(let i=0;i<amount;i++)confettiParts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[Math.floor(Math.random()*colors.length)],born:now});if(!confettiRunning){confettiRunning=true;requestAnimationFrame(confettiFrame)}}
function confettiFrame(now){const c=document.getElementById('confetti'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=Math.round(innerWidth*dpr),H=Math.round(innerHeight*dpr);if(c.width!==W||c.height!==H){c.width=W;c.height=H}ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.setTransform(dpr,0,0,dpr,0,0);confettiParts=confettiParts.filter(p=>now-p.born<2200&&p.y<innerHeight+40);confettiParts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-(now-p.born)/2200);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()});if(confettiParts.length)requestAnimationFrame(confettiFrame);else{confettiRunning=false;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H)}}
function celebrate(kind){if(kind==='win'){playSound('win');confetti(180)}else{playSound('good');confetti(45)}}
function updateSoundButtons(){const on=soundOn();const a=document.getElementById('navSound'),b=document.getElementById('mSound');if(a){a.textContent=on?'🔊 Geluid aan':'🔇 Geluid uit';a.setAttribute('aria-pressed',on)}if(b){b.textContent=on?'🔊':'🔇';b.setAttribute('aria-pressed',on)}}
function toggleSound(){stats.sound=!soundOn();saveStats();updateSoundButtons();if(soundOn())playSound('good')}
document.getElementById('navSound').onclick=toggleSound;document.getElementById('mSound').onclick=toggleSound;updateSoundButtons();
renderHome();
</script>
